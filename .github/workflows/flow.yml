# Three of the four flow checks on every pull request to `main` (EPIC-11 spec, section 2.12):
# `flow / failing-first` and `flow / test-lock` (`flow / mutation` is skipped here, so green). They
# run the pull request's own tests, so they run on `pull_request`. The fourth, the risk gate, is
# `gate / risk-gate` from `risk-gate.yml` (`pull_request_target`), which a pull request cannot
# change. Require on `main`, with `clippy` and `test` of ci.yml: `flow / failing-first`,
# `flow / test-lock`, `gate / risk-gate`.
# The checks' code is the backend's `flowchecks` package, pinned to a full commit SHA of
# tripmate-backend (the header of its flow-checks.yml explains why other repositories pin).
# Moving the pin is a normal pull request; it is High (`.github/**`).
# `edited` runs the checks again when the description changes.
#
# Rust tests are the integration tests `tests/<card>-<subject>.rs`; failing-first runs each new one
# on its own with `cargo test --test <file name without .rs>`, and `no-test-pattern` treats a run of
# 0 tests as an error.
name: Flow

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  flow:
    uses: huynguyennang-agilityio/tripmate-backend/.github/workflows/flow-checks.yml@ba95a38dfd195e61bcc04ca7a887273831a78f44
    with:
      rules-file: .github/risk-paths.toml
      test-file-pattern: tests/*.rs
      # failing_first splits this with shlex and appends the test file path, which becomes $1.
      test-command: bash -c 'cargo test --locked --test "$(basename "$1" .rs)"' run-test
      no-test-pattern: ^running 0 tests$
      # One step runs this; what it writes to $GITHUB_ENV reaches the later steps of the job, so
      # every worktree of a test commit builds into the same target folder.
      setup-command: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
        echo "CARGO_TARGET_DIR=$GITHUB_WORKSPACE/target" >> "$GITHUB_ENV"
        rustup toolchain install
        rustup show
        cargo fetch --locked
      run-mutation: false
      databases: false
      run-risk-gate: false
      flowchecks-repository: huynguyennang-agilityio/tripmate-backend
      flowchecks-ref: ba95a38dfd195e61bcc04ca7a887273831a78f44
